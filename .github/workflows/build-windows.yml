name: Build Windows EXE
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calendar conversion
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --clean --onefile --windowed --name BanglaCalendar bangla_calendar.py
      - uses: actions/upload-artifact@v4
        with:
          name: BanglaCalendar-Windows
          path: dist/BanglaCalendar.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/BanglaCalendar.exe
