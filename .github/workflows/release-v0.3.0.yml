name: Build and publish BanglaCalendar v0.3.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Check whether this is a release build
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$HEAD_MESSAGE" == "Release v0.3.0" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' }}
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x86_64
            os: windows-latest
            artifact_name: BanglaCalendar-Windows
            artifact_path: dist/BanglaCalendar.exe
          - platform: Linux x86_64 AppImage
            os: ubuntu-22.04
            artifact_name: BanglaCalendar-AppImage
            artifact_path: dist/BanglaCalendar-x86_64.AppImage
          - platform: macOS Apple Silicon
            os: macos-15
            artifact_name: BanglaCalendar-macOS-arm64
            artifact_path: dist/BanglaCalendar-macOS-arm64.zip
          - platform: macOS Intel
            os: macos-15-intel
            artifact_name: BanglaCalendar-macOS-x86_64
            artifact_path: dist/BanglaCalendar-macOS-x86_64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: python -m PyInstaller --clean --onefile --windowed --name BanglaCalendar bangla_calendar.py

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: python -m PyInstaller --clean --onefile --windowed --name BanglaCalendar bangla_calendar.py

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/scalable/apps"
          install -m 0755 dist/BanglaCalendar "$APPDIR/usr/bin/BanglaCalendar"
          install -m 0755 packaging/linux/AppRun "$APPDIR/AppRun"
          install -m 0644 packaging/linux/banglacalendar.desktop "$APPDIR/banglacalendar.desktop"
          install -m 0644 packaging/linux/banglacalendar.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/banglacalendar.svg"
          install -m 0644 packaging/linux/banglacalendar.svg "$APPDIR/banglacalendar.svg"
          install -m 0644 LICENSE "$APPDIR/LICENSE"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 VERSION=0.3.0 \
            ./appimagetool-x86_64.AppImage "$APPDIR" dist/BanglaCalendar-x86_64.AppImage
          chmod +x dist/BanglaCalendar-x86_64.AppImage
          file dist/BanglaCalendar-x86_64.AppImage

      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: python -m PyInstaller --clean --windowed --name BanglaCalendar bangla_calendar.py

      - name: Package macOS application bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ARCH}" == "ARM64" ]]; then
            ditto -c -k --sequesterRsrc --keepParent dist/BanglaCalendar.app dist/BanglaCalendar-macOS-arm64.zip
          else
            ditto -c -k --sequesterRsrc --keepParent dist/BanglaCalendar.app dist/BanglaCalendar-macOS-x86_64.zip
          fi

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish v0.3.0 desktop release
    needs: [prepare, desktop]
    if: ${{ needs.prepare.outputs.should_build == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v0.3.0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download desktop builds
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp downloaded-artifacts/BanglaCalendar-Windows/BanglaCalendar.exe release-assets/BanglaCalendar.exe
          cp downloaded-artifacts/BanglaCalendar-AppImage/BanglaCalendar-x86_64.AppImage release-assets/BanglaCalendar-x86_64.AppImage
          cp downloaded-artifacts/BanglaCalendar-macOS-arm64/BanglaCalendar-macOS-arm64.zip release-assets/BanglaCalendar-macOS-arm64.zip
          cp downloaded-artifacts/BanglaCalendar-macOS-x86_64/BanglaCalendar-macOS-x86_64.zip release-assets/BanglaCalendar-macOS-x86_64.zip
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BanglaCalendar v0.3.0
          tag_name: v0.3.0
          target_commitish: main
          body_path: RELEASE_NOTES_v0.3.0.md
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/BanglaCalendar.exe
            release-assets/BanglaCalendar-x86_64.AppImage
            release-assets/BanglaCalendar-macOS-arm64.zip
            release-assets/BanglaCalendar-macOS-x86_64.zip
